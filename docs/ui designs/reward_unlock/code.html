<script>
        // Micro-interaction: Sparkle Effect Generator
        function createSparkles() {
            const container = document.getElementById('sparkle-container');
            const sparkleCount = 40;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                sparkle.style.left = `${x}%`;
                sparkle.style.top = `${y}%`;
                
                // Random size
                const size = Math.random() * 6 + 2;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                
                // Random animation delay
                const delay = Math.random() * 5;
                const duration = Math.random() * 3 + 2;
                sparkle.style.animation = `sparkle ${duration}s ease-in-out ${delay}s infinite`;
                
                // Varied colors
                const colors = ['#FFD700', '#B4C5FF', '#FFFFFF', '#F59E0B'];
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(sparkle);
            }
        }

        // Initialize sparkles on load
        window.addEventListener('load', createSparkles);

        // Simple button interaction
        document.querySelectorAll('button').forEach(btn => {
