<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        .tech-grid {
            background-image: 
                linear-gradient(to right, rgba(203, 213, 225, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(203, 213, 225, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .map-dot {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.1); }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#f8f9ff",
                      "outline-variant": "#c3c6d7",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-secondary-fixed-variant": "#653e00",
                      "primary-container": "#2563eb",
                      "on-error-container": "#93000a",
                      "tertiary": "#4d556b",
                      "primary": "#004ac6",
                      "on-surface-variant": "#434655",
                      "on-background": "#0b1c30",
                      "surface-dim": "#cbdbf5",
                      "outline": "#737686",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#d3e4fe",
                      "tertiary-fixed": "#dae2fd",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed-dim": "#bec6e0",
                      "inverse-surface": "#213145",
                      "surface-container": "#e5eeff",
                      "surface-tint": "#0053db",
                      "primary-fixed-dim": "#b4c5ff",
                      "on-tertiary-container": "#eef0ff",
                      "inverse-primary": "#b4c5ff",
                      "surface-container-high": "#dce9ff",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed": "#131b2e",
                      "surface-container-low": "#eff4ff",
                      "surface-bright": "#f8f9ff",
                      "secondary-fixed": "#ffddb8",
                      "secondary": "#855300",
                      "on-error": "#ffffff",
                      "on-secondary-fixed": "#2a1700",
                      "secondary-container": "#fea619",
                      "on-surface": "#0b1c30",
                      "tertiary-container": "#656d84",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#eeefff",
                      "inverse-on-surface": "#eaf1ff",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#684000",
                      "on-tertiary-fixed-variant": "#3f465c",
                      "secondary-fixed-dim": "#ffb95f",
                      "on-primary": "#ffffff",
                      "primary-fixed": "#dbe1ff",
                      "on-primary-fixed": "#00174b",
                      "background": "#f8f9ff",
                      "surface-variant": "#d3e4fe"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "margin-desktop": "40px",
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "headline-lg": ["Geist"],
                      "label-sm": ["Space Mono"],
                      "label-md": ["Space Mono"],
                      "body-lg": ["Geist"],
                      "headline-lg-mobile": ["Geist"],
                      "headline-xl": ["Geist"],
                      "headline-md": ["Geist"],
                      "body-md": ["Geist"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "label-md": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                      "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top AppBar (from Shared Components) -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-white/80 border-b border-outline-variant shadow-sm flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist profile portrait of a young professional in a light-filled studio. The photography follows a high-key lighting style with soft shadows, fitting the professional light-mode aesthetic of the app. The color palette is dominated by neutral whites and subtle slate blues, maintaining a consistent, laboratory-grade visual clarity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPqMWG2BExiMUU46kblFEeW8wuxdzeQMjSrgBaCBvn6ThrYn2WSKwoc-ENFMgSojuloJMD9Bn5fcaYM1Xob8aQ_6ev0171LnBKRz5dZdD16ivFshi-2AVfdF6OB1-VfqlLdSaSaOvjcO_Rs9C0ccdufJshBqQwYMruQvaCvuUPUHDodDlEF7anLIZrnATQQap8tkV_5VTPOmBG6SXFR59GdJUPDlGVBvUzREYoKAtvVAG1UZi-9LqRSohp-cAGB2g7FNPpxOsBvck"/>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">PIKE</span>
</div>
<!-- Desktop Nav -->
<nav class="hidden md:flex gap-8 items-center">
<a class="text-on-surface-variant font-label-md hover:opacity-80 transition-opacity" href="#">Home</a>
<a class="text-primary font-label-md hover:opacity-80 transition-opacity border-b-2 border-primary pb-1" href="#">Explore</a>
<a class="text-on-surface-variant font-label-md hover:opacity-80 transition-opacity" href="#">Quests</a>
<a class="text-on-surface-variant font-label-md hover:opacity-80 transition-opacity" href="#">Profile</a>
</nav>
<button class="active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
</header>
<!-- Main Map Canvas -->
<main class="relative w-full h-screen pt-16 pb-20 md:pb-0 overflow-hidden flex flex-col items-center justify-center">
<!-- Map Background & Grid -->
<div class="absolute inset-0 z-0 tech-grid bg-surface">
<!-- Simulated High-Tech Light Map UI -->
<div class="absolute inset-0" data-location="San Francisco" style="">
<!-- Overlay Canvas for Grid Lines & Map Symbols -->
<div class="w-full h-full opacity-40">
<div class="absolute top-1/4 left-1/3 w-[800px] h-[600px] border border-outline-variant/30 rotate-12"></div>
<div class="absolute top-1/2 left-1/2 w-[1200px] h-[900px] border border-outline-variant/20 -translate-x-1/2 -translate-y-1/2"></div>
</div>
<!-- Placeholder Image for High-Tech Map -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<img class="w-full h-full object-cover" data-alt="A sophisticated, high-tech digital map interface in light mode. The map features a minimalist white and light gray color scheme with precise, laboratory-grade hairline grid patterns. Topographical data is represented by clean, geometric vector lines. The overall aesthetic is professional, systematic, and ultra-modern, emphasizing precision engineering and mission-critical technical performance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUGWuypRHRRP4zfqu-4EiG-x1r--nZCl3WhNzL18psxd8uQaFGGPI4w-QFRe8rrwFO02pGf2GU6wXO_XHVbwQanyRr-PmrAAkLKThXCRWUVLEcKlxnggvotC0Fdpp0GWLYv-nU543uc4nSAQP_xuJA9_UDU1FS_Lo7YhkITp8fV4131UZIyahR7xnxtF5tVcVpU3xIPh1VUwhL7XwP-34s82yRH9OmR0csfnY_wNmERUq_Vr-EklauMY-PM8KogJPk4P5mEV4MSGI"/>
</div>
</div>
</div>
<!-- Floating Search Bar -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-40 w-full max-w-lg px-margin-mobile">
<div class="glass-panel border border-outline-variant rounded-xl shadow-sm p-1.5 flex items-center gap-3">
<div class="pl-3 text-outline">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-body-md placeholder:text-outline font-body-md" placeholder="Explore Nearby" type="text" value="San Francisco, CA"/>
<button class="bg-primary text-white h-10 px-4 rounded-lg font-label-md uppercase tracking-wider flex items-center gap-2 hover:opacity-90 transition-opacity">
                    Scan
                </button>
</div>
</div>
<!-- Interactive Map Markers -->
<div class="relative z-10 w-full h-full max-w-container-max mx-auto overflow-visible">
<!-- Marker: Completed (Gold) -->
<div class="absolute top-[30%] left-[25%] group cursor-pointer">
<div class="flex flex-col items-center">
<div class="bg-secondary-container text-on-secondary-container p-2 rounded-full shadow-lg group-hover:scale-110 transition-transform duration-300 border-2 border-white">
<span class="material-symbols-outlined filled-icon text-[20px]">check_circle</span>
</div>
<div class="mt-2 bg-white/90 backdrop-blur-sm border border-outline-variant px-3 py-1 rounded shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
<span class="font-label-sm text-secondary">ARCHIVE-01</span>
</div>
</div>
</div>
<!-- Marker: Active (Blue) -->
<div class="absolute top-[55%] left-[60%] group cursor-pointer">
<div class="flex flex-col items-center">
<div class="bg-primary text-white p-2 rounded-full shadow-lg group-hover:scale-110 transition-transform duration-300 border-2 border-white map-dot">
<span class="material-symbols-outlined filled-icon text-[20px]">my_location</span>
</div>
<div class="mt-2 glass-panel border border-primary px-3 py-1 rounded shadow-sm">
<span class="font-label-sm text-primary font-bold">PIKE HEADQUARTERS</span>
</div>
</div>
</div>
<!-- Marker: Legendary (Purple/Tertiary) -->
<div class="absolute top-[40%] right-[15%] group cursor-pointer">
<div class="flex flex-col items-center">
<div class="bg-tertiary-container text-on-tertiary-container p-3 rounded-full shadow-xl group-hover:scale-110 transition-transform duration-300 border-2 border-white border-dashed">
<span class="material-symbols-outlined filled-icon text-[24px]">grade</span>
</div>
<div class="mt-2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-lg shadow-sm border border-outline opacity-90">
<div class="font-label-sm font-bold uppercase tracking-widest">Legendary Encounter</div>
<div class="font-body-md text-[12px] opacity-70">Rarity: 0.04%</div>
</div>
</div>
</div>
<!-- More subtle markers -->
<div class="absolute bottom-[20%] left-[40%] w-3 h-3 bg-primary/20 rounded-full animate-ping"></div>
<div class="absolute top-[15%] right-[30%] w-4 h-4 bg-secondary/20 rounded-full animate-ping"></div>
</div>
<!-- Map Legend (Bottom Panel) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-40 w-full max-w-2xl px-margin-mobile">
<div class="glass-panel border border-outline-variant rounded-xl shadow-lg p-6">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary">map</span>
                            Map Legend
                        </h2>
<p class="font-body-md text-[14px] text-outline">San Francisco Operational Sector</p>
</div>
<div class="grid grid-cols-3 gap-4 w-full md:w-auto">
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-secondary-container"></div>
<span class="font-label-sm text-on-surface-variant">Completed</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-primary-container"></div>
<span class="font-label-sm text-on-surface-variant">Active</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-tertiary-container"></div>
<span class="font-label-sm text-on-surface-variant">Legendary</span>
</div>
</div>
</div>
<div class="mt-6 pt-6 border-t border-outline-variant flex flex-wrap gap-3">
<button class="bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-primary hover:text-white transition-all flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] group-hover:rotate-180 transition-transform">filter_list</span>
                        All Sectors
                    </button>
<button class="bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-primary hover:text-white transition-all flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px]">satellite</span>
                        Terrain View
                    </button>
<button class="bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-primary hover:text-white transition-all flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px]">layers</span>
                        Quests Only
                    </button>
</div>
</div>
</div>
<!-- Floating Action Button -->
<button class="fixed right-margin-desktop bottom-24 md:bottom-8 z-50 bg-primary text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center active:scale-90 duration-200 hover:brightness-110 group">
<span class="material-symbols-outlined text-[32px] group-hover:rotate-90 transition-transform">add</span>
</button>
</main>
<!-- Bottom Nav Bar (Mobile Only) -->
<nav class="fixed bottom-0 w-full z-50 backdrop-blur-md bg-white/80 border-t border-outline-variant flex justify-around items-center h-20 px-margin-mobile md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 duration-200">
<span class="material-symbols-outlined filled-icon">explore</span>
<span class="font-label-sm text-label-sm mt-1">Explore</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">assignment</span>
<span class="font-label-sm text-label-sm mt-1">Quests</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
<script>
        // Simple micro-interaction for markers
        document.querySelectorAll('.cursor-pointer').forEach(marker => {
            marker.addEventListener('click', () => {
                marker.classList.add('scale-125');
                setTimeout(() => marker.classList.remove('scale-125'), 200);
            });
        });

        // Search bar input effect
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('border-primary', 'ring-2', 'ring-primary-container/20');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('border-primary', 'ring-2', 'ring-primary-container/20');
        });
    </script>
</body></html>
